# LangGraph4j Builder 的 Docker 启动方式。
#
#   ./scripts/start-builder.sh --docker
#   # 或
#   docker compose up
#
# 说明：Docker Hub 上 bsorrentino/langgraph4j-builder 目前只发布了
# 1.6-SNAPSHOT / 1.5.0-SNAPSHOT 两个标签。如果无法访问 Docker Hub，
# 直接用 `./scripts/start-builder.sh` 走工程内自带的运行副本即可。
services:
  langgraph4j-builder:
    image: bsorrentino/langgraph4j-builder:1.6-SNAPSHOT
    container_name: owneragent-langgraph4j-builder
    ports:
      - "${BUILDER_PORT:-3000}:3000"
    volumes:
      # 画布「保存图」写入 /app/workspace，落到工程根目录的 builder-workspace/
      - ./builder-workspace:/app/workspace
    environment:
      - NODE_ENV=production
      - LANGRAPH4J_GEN=generator-1.6-SNAPSHOT-jar-with-dependencies.jar
      - RUNNING_IN_DOCKER=true
